name: Research prototype checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tested Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0

      - name: Format and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings

      - name: Rust tests and API-boundary doctests
        run: |
          cargo test --all-targets
          cargo test --doc

      - name: Offline Python regression tests
        run: |
          python3 scripts/test_run_prepublication_experiment.py
          python3 scripts/test_aisig_lab.py
          python3 scripts/test_prepare_model_publication.py

      - name: Reviewed-case evaluations and result drift
        run: |
          cargo run --release --bin eval
          cargo run --bin eval_rq123
          git diff --exit-code -- results/
