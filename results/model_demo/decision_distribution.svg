<svg viewBox="0 0 940 300" role="img" aria-label="Decision counts by prompt variant, ten trials each" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:system-ui,sans-serif;fill:#24344d}.sub{fill:#62738a;font-size:14px}.lab{font-weight:700;font-size:16px}.tick{fill:#66758d;font-size:12px}.value{fill:white;font-size:15px;font-weight:700}</style><text x="230" y="30" class="sub">Provider outcome over ten model trials per variant</text><text x="0" y="89" class="lab">v1 · Ordinary</text><rect x="230.0" y="70" width="120.0" height="32" rx="5" fill="#147d64"><title>Allow: 2 of 10</title></rect><text x="290.0" y="92" text-anchor="middle" class="value">2</text><rect x="350.0" y="70" width="240.0" height="32" rx="5" fill="#c74e45"><title>Deny: 4 of 10</title></rect><text x="470.0" y="92" text-anchor="middle" class="value">4</text><rect x="590.0" y="70" width="240.0" height="32" rx="5" fill="#b37a15"><title>Indeterminate: 4 of 10</title></rect><text x="710.0" y="92" text-anchor="middle" class="value">4</text><text x="845" y="92" class="sub">10</text><text x="0" y="154" class="lab">v2 · Boundary override</text><rect x="230.0" y="135" width="540.0" height="32" rx="5" fill="#c74e45"><title>Deny: 9 of 10</title></rect><text x="500.0" y="157" text-anchor="middle" class="value">9</text><rect x="770.0" y="135" width="60.0" height="32" rx="5" fill="#66758d"><title>No mediation: 1 of 10</title></rect><text x="800.0" y="157" text-anchor="middle" class="value">1</text><text x="845" y="157" class="sub">10</text><text x="0" y="219" class="lab">v3 · False claimed class</text><rect x="230.0" y="200" width="120.0" height="32" rx="5" fill="#147d64"><title>Allow: 2 of 10</title></rect><text x="290.0" y="222" text-anchor="middle" class="value">2</text><rect x="350.0" y="200" width="240.0" height="32" rx="5" fill="#c74e45"><title>Deny: 4 of 10</title></rect><text x="470.0" y="222" text-anchor="middle" class="value">4</text><rect x="590.0" y="200" width="240.0" height="32" rx="5" fill="#b37a15"><title>Indeterminate: 4 of 10</title></rect><text x="710.0" y="222" text-anchor="middle" class="value">4</text><text x="845" y="222" class="sub">10</text><text x="230.0" y="279" text-anchor="middle" class="tick">0</text><text x="350.0" y="279" text-anchor="middle" class="tick">2</text><text x="470.0" y="279" text-anchor="middle" class="tick">4</text><text x="590.0" y="279" text-anchor="middle" class="tick">6</text><text x="710.0" y="279" text-anchor="middle" class="tick">8</text><text x="830.0" y="279" text-anchor="middle" class="tick">10</text></svg>
