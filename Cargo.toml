[package]
name = "aisig-proto"
version = "0.1.0"
edition = "2021"
publish = false
description = "Research prototype: provider-verified authorization chains for AI-agent security testing (synthetic data only)"
# No license chosen yet; see README.

[dependencies]
base64 = "0.23"
ed25519-dalek = "3.0"
getrandom = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
toml = "1"

[dev-dependencies]
proptest = "1.12"
