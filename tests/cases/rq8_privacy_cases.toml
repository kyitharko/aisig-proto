# --- linkability: identical vs legitimately reissued grant ---

[[case]]
id = "PL01"
kind = "rq8_privacy"
expected = "signed_bytes=equal issuer_key_id=equal tester_key_id=equal status_key.org_id=equal status_key.object_type=equal status_key.id=equal status_key.version=equal status_key.digest=equal"
label_status = "reviewed"
note = "the identical built+verified grant presented twice -> fully linkable"

[[case]]
id = "PL02"
kind = "rq8_privacy"
expected = "signed_bytes=differ issuer_key_id=equal tester_key_id=equal status_key.org_id=equal status_key.object_type=equal status_key.id=equal status_key.version=differ status_key.digest=differ"
label_status = "reviewed"
note = "a new engagement reissued under a new grant version (changes engagement_id + version; spec §6 requires a new version/id): signed bytes / version / digest differ, but issuer_key_id, tester_key_id and StatusKey org_id/object_type/id still correlate"
