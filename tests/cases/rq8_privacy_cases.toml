# RQ8 Q1 (privacy) proposed observations — docs/rq8.md "Q1 measurement slice 1".
# Written BEFORE the runner; the runner extracts the ACTUAL field sets / comparisons and must
# match these. Never edit a label to match implementation output. All `proposed` (owner review
# pending). Synthetic only; no network, no real data. `expected` holds the full observation
# string the runner emits.
#
# FD* = field-disclosure inventory per artifact (sorted canonical field names, comma-joined).
# PO* = which artifacts each observer actually receives (sorted, comma-joined).
# PL* = linkability comparison (signed bytes / key ids / exact StatusKey reported separately).

