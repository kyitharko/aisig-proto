[[case]]
id = "PO3"
kind = "rq8_privacy"
expected = "status_key"
label_status = "proposed"
note = "O3 responder R: only the StatusKey query; the model assumes R never gets P's now/ε"

[[case]]
id = "PO5"
kind = "rq8_privacy"
expected = "effect_receipt"
label_status = "proposed"
note = "O5 log/effect-sink reader: the effect receipts"

# --- linkability: identical vs legitimately reissued grant ---

[[case]]
id = "PL01"
kind = "rq8_privacy"
expected = "signed_bytes=equal issuer_key_id=equal tester_key_id=equal status_key=equal"
label_status = "proposed"
note = "the identical signed grant presented twice -> fully linkable"

[[case]]
id = "PL02"
kind = "rq8_privacy"
expected = "signed_bytes=differ issuer_key_id=equal tester_key_id=equal status_key=differ"
label_status = "proposed"
note = "a reissued grant (new engagement_id, same parties): key ids still correlate, signed bytes and StatusKey do not"
