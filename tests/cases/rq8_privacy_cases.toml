# --- observer -> artifacts actually received ---

[[case]]
id = "PO1"
kind = "rq8_privacy"
expected = "admin,grant,issuer"
label_status = "proposed"
note = "O1 bundle holder (e.g. tester / anyone shown a grant): the three chain objects"

[[case]]
id = "PO2"
kind = "rq8_privacy"
expected = "admin,challenge,grant,issuer,proof,status_response"
label_status = "proposed"
