kind = "rq8_onboarding"
expected = "mediation_request_bundle_slot_bytes=4468"
label_status = "proposed"
note = "in-memory bundle-slot bytes carried inside a MediationRequest (sum of its 4 slot envelopes); no transmission-cost claim — there is no request wire encoding/transport, and transport framing and repeated-request cost are unmeasured"

