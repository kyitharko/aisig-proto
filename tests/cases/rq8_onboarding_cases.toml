# RQ8 Q3 (onboarding / cost) observations — docs/rq8.md "Q3 measurement slice 1".
# Written BEFORE the runner. Two kinds, kept distinct:
#  OB* = canonical artifact BYTE SIZES (bundle slots only), measured from the actual fixture
#        bytes. Each states exactly which count it is (signed payload / signature / full envelope
#        / in-memory). Signed payloads are a subset of envelope bytes and are NOT added to them.
#        OB11 reports only the in-memory bundle-slot size inside a MediationRequest; it makes no
#        transmission-cost claim (transport framing and repeated-request cost are unmeasured).
#  OS-* = per-party step INVENTORY COUNTS (a structural model, not a measurement; the critical
#        path — dependency ordering and durations — is left open): implemented / assumed-oob /
#        design-only. Parties: O, A=admin(K_admin, issues D_U), U=issuer(K_authorizer, issues G),
#        T, P, R.
# No human time, monetary cost, storage bill, duration, or operational effort is inferred from
# these. All `proposed` (owner review pending). Never edit a label to match implementation output.

# --- artifact byte sizes (measured) ---

[[case]]
id = "OB01"
kind = "rq8_onboarding"
expected = "cA_signed_payload_bytes=654"
label_status = "proposed"
note = "C_A canonical signed payload (bytes the signature covers)"

