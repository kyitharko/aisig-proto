# RQ8 Q3 (onboarding / cost) observations — docs/rq8.md "Q3 measurement slice 1".
# Written BEFORE the runner. Two kinds, kept distinct:
#  OB* = canonical artifact BYTE SIZES, measured from the actual fixture bytes. Each states
#        exactly which count it is (signed payload / signature / full envelope / in-memory).
#        Signed payloads are a subset of envelope bytes and are NOT added to them; the
#        MediationRequest re-carries the bundle (OB11), a duplication, not an independent cost.
#  OS-* = per-party step / critical-path map COUNTS (a structural model, not a measurement):
#        implemented / assumed-oob / design-only.
# No human time, monetary cost, storage bill, or operational effort is inferred from these.
# All `proposed` (owner review pending). Never edit a label to match implementation output.

# --- artifact byte sizes (measured) ---

[[case]]
id = "OB01"
kind = "rq8_onboarding"
expected = "cA_signed_payload_bytes=654"
label_status = "proposed"
note = "C_A canonical signed payload (bytes the signature covers)"

